name: Verify CA bundle stamp and re-pin fixture base images
on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *" # Daily at 1 AM UTC
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-ca-cert.yaml"
      - "tests/e2e/fixtures/*/Dockerfile"
      - "tests/oscap-offline/internal/scan/fixtures_test.go"
concurrency:
  group: update-ca-cert-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  update-ca-cert:
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'chainguard-dev' }}
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      pull-requests: write
      issues: write
    env:
      # The image the E2E fixtures are pinned to, re-resolved below.
      IMAGE_REF: cgr.dev/chainguard/wolfi-base:latest
      # The image the stamp-file guard inspects. jre carries BOTH stamps
      # CertificateAudit reads — /etc/ssl/certs/.ca-certificates.crt.sha256 and
      # /etc/ssl/certs/java/.cacerts.sha256 — so one image covers the whole rule.
      # wolfi-base has no Java and would leave the truststore half unguarded.
      STAMP_IMAGE_REF: cgr.dev/chainguard/jre:latest
      TESTS_PATH: tests
      FIXTURES_GLOB: tests/e2e/fixtures/*/Dockerfile
      TEST_PIN_FILE: tests/oscap-offline/internal/scan/fixtures_test.go
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - name: Generate token for PR
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        id: octo-sts
        with:
          scope: ${{ github.repository }}
          identity: ca-cert-updater
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Setup crane
        uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7
      - name: Pull and verify images
        id: image
        run: |
          set -euo pipefail

          # Verify a tag's signature and echo its digest-pinned reference.
          # cosign's own output is dropped so only the ref lands on stdout; the
          # command substitution runs this in a subshell, so `exit 1` aborts the
          # substitution and `set -e` then fails the step.
          resolve_and_verify() {
            local ref="$1" full
            full="${ref%:*}@$(crane digest "${ref}")"
            cosign verify \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity-regexp "https://github.com/chainguard-images/images/.*" \
              "${full}" >/dev/null || {
                echo "::error::Image signature verification failed: ${ref}"
                exit 1
              }
            echo "${full}"
          }

          FULL_REF=$(resolve_and_verify "${IMAGE_REF}")
          STAMP_FULL_REF=$(resolve_and_verify "${STAMP_IMAGE_REF}")

          echo "digest=${FULL_REF#*@}" >> "$GITHUB_OUTPUT"
          echo "full_ref=${FULL_REF}" >> "$GITHUB_OUTPUT"
          echo "stamp_digest=${STAMP_FULL_REF#*@}" >> "$GITHUB_OUTPUT"
          echo "stamp_full_ref=${STAMP_FULL_REF}" >> "$GITHUB_OUTPUT"
      - name: Verify trust-store stamp files
        id: ca
        env:
          STEPS_IMAGE_OUTPUTS_STAMP_FULL_REF: ${{ steps.image.outputs.stamp_full_ref }}
          STEPS_IMAGE_OUTPUTS_STAMP_DIGEST: ${{ steps.image.outputs.stamp_digest }}
        run: |
          set -euo pipefail

          # CertificateAudit no longer pins any hash in the datastream: the OVAL
          # reads each expected digest out of the stamp file the owning package
          # ships next to the file it describes, in sha256sum format —
          #   /etc/ssl/certs/.ca-certificates.crt.sha256   (always)
          #   /etc/ssl/certs/java/.cacerts.sha256          (Java images only)
          # — and compares the real file against it. Nothing in this repo needs
          # updating when either rolls upstream.
          #
          # This step guards the premise that replaced the pins: if a future
          # image drops a stamp file, renames it, or ships one that disagrees
          # with the file it names, the rule starts failing on clean images.
          # Fail loudly here — daily — instead of finding out via a red E2E run.
          #
          # The jre image is used because it carries BOTH stamps, so a single
          # export covers the whole rule. wolfi-base has no Java and would leave
          # the truststore criterion unguarded.

          workdir=$(mktemp -d)
          crane export "${STEPS_IMAGE_OUTPUTS_STAMP_FULL_REF}" - | \
            tar -C "${workdir}" -x \
              etc/ssl/certs/ca-certificates.crt \
              etc/ssl/certs/.ca-certificates.crt.sha256 \
              etc/ssl/certs/java/cacerts \
              etc/ssl/certs/java/.cacerts.sha256

          # Both stamps must be present and correct. Checking each separately
          # (rather than one combined sha256sum -c) keeps the error message
          # specific about which trust store drifted.
          for pair in "etc/ssl/certs:.ca-certificates.crt.sha256" "etc/ssl/certs/java:.cacerts.sha256"; do
            dir="${pair%%:*}"
            stamp="${pair#*:}"
            if [ ! -f "${workdir}/${dir}/${stamp}" ]; then
              echo "::error::${dir}/${stamp} missing from ${STAMP_IMAGE_REF}; CertificateAudit will fail on clean images"
              exit 1
            fi
            if ! (cd "${workdir}/${dir}" && sha256sum -c "${stamp}"); then
              echo "::error::${dir} contents do not match ${stamp} in ${STAMP_IMAGE_REF}; CertificateAudit will fail on clean images"
              exit 1
            fi
          done

          SHA=$(sha256sum "${workdir}/etc/ssl/certs/ca-certificates.crt" | cut -d' ' -f1)
          JAVA_SHA=$(sha256sum "${workdir}/etc/ssl/certs/java/cacerts" | cut -d' ' -f1)
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ### Trust Store Stamp Check
          - **Image**: \`${STAMP_IMAGE_REF}\`
          - **Digest**: \`${STEPS_IMAGE_OUTPUTS_STAMP_DIGEST}\`
          - **CA bundle SHA256**: \`${SHA}\` (matches stamp)
          - **Java truststore SHA256**: \`${JAVA_SHA}\` (matches stamp)
          EOF
      - name: Re-pin E2E fixture base-image digests
        id: fixtures
        env:
          STEPS_IMAGE_OUTPUTS_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail

          # Re-pin every `FROM <image>@sha256:<old>` in tests/e2e/fixtures/*/Dockerfile
          # to the current digest, verified above to carry a self-consistent CA
          # bundle and stamp file. The fixtures no longer have to track a hash in
          # the datastream, so this is ordinary base-image freshness: it keeps the
          # E2E fixtures scanning a recent image rather than an ageing pin.
          #
          # For each Dockerfile:
          #   - Parse the existing FROM line's `image` (everything before `@sha256:`).
          #   - Re-resolve that image's current digest with `crane digest <image>`.
          #   - Substitute the new digest in place, preserving the rest of the line.
          #
          # This generalizes beyond wolfi-base: any fixture using a digest-pinned
          # cgr.dev image gets re-pinned to its own current digest. The wolfi-base
          # digest is expected to match ${STEPS_IMAGE_OUTPUTS_DIGEST} (we already
          # resolved and verified it), so we reuse that to avoid a redundant lookup.
          #
          # The offline harness (tests/oscap-offline) reads its pinned base image
          # from tests/e2e/fixtures/baseline-clean/Dockerfile, so re-pinning that
          # fixture here also moves the offline CertificateAudit fixtures. The one
          # remaining copy of the digest — the `pinned` constant in
          # TestParseWolfiBaseRef — is re-pinned by the next step.

          fixtures_changed=false
          updated_files=()

          # shellcheck disable=SC2086 # intentional glob expansion
          shopt -s nullglob
          for dockerfile in ${FIXTURES_GLOB}; do
            # Extract FROM line (first match); skip if no digest-pinned FROM present.
            from_line=$(grep -E '^FROM [^ ]+@sha256:[0-9a-f]{64}' "${dockerfile}" | head -n1 || true)
            if [ -z "${from_line}" ]; then
              echo "No digest-pinned FROM in ${dockerfile}; skipping"
              continue
            fi

            # image = token after FROM, up to and including the tag (everything before @sha256:)
            image_with_tag=$(echo "${from_line}" | awk '{print $2}' | sed -E 's/@sha256:[0-9a-f]{64}$//')

            # Reuse already-resolved digest for the canonical IMAGE_REF; otherwise query.
            if [ "${image_with_tag}" = "${IMAGE_REF}" ]; then
              new_digest="${STEPS_IMAGE_OUTPUTS_DIGEST}"
            else
              new_digest=$(crane digest "${image_with_tag}")
            fi

            cp "${dockerfile}" "${dockerfile}.bak"
            # Surgical replace: only the @sha256:<hex> suffix on lines starting with FROM <image_with_tag>@
            # Use a safe sed delimiter (|) since image refs may contain /.
            sed -i -E "s|^(FROM ${image_with_tag}@sha256:)[0-9a-f]{64}|\1${new_digest#sha256:}|" "${dockerfile}"

            if ! diff -q "${dockerfile}.bak" "${dockerfile}" > /dev/null; then
              fixtures_changed=true
              updated_files+=("${dockerfile}")
              echo "Updated ${dockerfile} -> ${new_digest}"
            fi
            rm "${dockerfile}.bak"
          done

          echo "fixtures_changed=${fixtures_changed}" >> "$GITHUB_OUTPUT"

          echo "### Fixture Dockerfile Update Summary" >> "$GITHUB_STEP_SUMMARY"
          if [ "${fixtures_changed}" = "true" ]; then
            echo "- **Status**: Updated" >> "$GITHUB_STEP_SUMMARY"
            for f in "${updated_files[@]}"; do
              echo "  - \`${f}\`" >> "$GITHUB_STEP_SUMMARY"
            done
          else
            echo "- **Status**: Already up-to-date" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Re-pin offline harness test digest
        id: testpin
        env:
          STEPS_IMAGE_OUTPUTS_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail

          # TestParseWolfiBaseRef asserts the exact digest-pinned wolfi-base ref
          # parsed from tests/e2e/fixtures/baseline-clean/Dockerfile against a
          # hardcoded `pinned` constant, so that constant must move together
          # with the fixture re-pin above or the test breaks on every update
          # (see #123 for the manual fix this step replaces).
          #
          # The grep guard fails the run loudly if the constant's shape changes
          # (e.g. the test is refactored) so the workflow gets updated instead
          # of silently reintroducing drift.

          if ! grep -qE 'wolfiBaseRepo \+ ":latest@sha256:[0-9a-f]{64}"' "${TEST_PIN_FILE}"; then
            echo "::error::Pinned digest constant not found in ${TEST_PIN_FILE}; update this workflow to match the test"
            exit 1
          fi

          cp "${TEST_PIN_FILE}" "${TEST_PIN_FILE}.bak"
          sed -i -E "s|(wolfiBaseRepo \+ \":latest@sha256:)[0-9a-f]{64}|\1${STEPS_IMAGE_OUTPUTS_DIGEST#sha256:}|" "${TEST_PIN_FILE}"

          if diff -q "${TEST_PIN_FILE}.bak" "${TEST_PIN_FILE}" > /dev/null; then
            echo "Test pin already up to date"
            echo "test_pin_changed=false" >> "$GITHUB_OUTPUT"
            testpin_status="Already up-to-date"
          else
            echo "Updated ${TEST_PIN_FILE} -> ${STEPS_IMAGE_OUTPUTS_DIGEST}"
            echo "test_pin_changed=true" >> "$GITHUB_OUTPUT"
            testpin_status="Updated"
          fi
          rm "${TEST_PIN_FILE}.bak"

          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ### Test Pin Update Summary
          - **File**: \`${TEST_PIN_FILE}\`
          - **Status**: ${testpin_status}
          EOF
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'tests/oscap-offline/go.mod'
          cache-dependency-path: 'tests/oscap-offline/go.sum'
      - name: Verify test pin matches fixture
        working-directory: tests/oscap-offline
        run: |
          set -euo pipefail

          # Proves the re-pinned `pinned` constant agrees with the re-pinned
          # baseline-clean Dockerfile before any PR is opened, so a bad sed (or
          # drift introduced outside this workflow) fails here instead of
          # landing as a broken PR. Pure parse test; needs no container runtime.
          go test -count=1 -run 'TestParseWolfiBaseRef' ./internal/scan/
      - name: Aggregate change status
        id: changed
        env:
          FX_CHANGED: ${{ steps.fixtures.outputs.fixtures_changed }}
          TP_CHANGED: ${{ steps.testpin.outputs.test_pin_changed }}
        run: |
          set -euo pipefail
          if [ "${FX_CHANGED}" = "true" ] || [ "${TP_CHANGED}" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Setup gitsign
        if: steps.changed.outputs.changed == 'true'
        uses: chainguard-dev/actions/setup-gitsign@9d631658f55713e5f63ca0cc21ee168f81301fd9 # v1.6.30
      - name: Create Pull Request
        if: steps.changed.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        id: cpr
        with:
          token: ${{ steps.octo-sts.outputs.token }}
          commit-message: |
            chore(oscap): re-pin fixture base-image digests

            Re-pins the digest-pinned FROM lines in tests/e2e/fixtures/*/Dockerfile
            and the pinned wolfi-base digest in the offline harness test
            (TestParseWolfiBaseRef) together, so the two can never drift out of
            sync and break the offline unit tests.

            Both stamp files CertificateAudit reads were checked first, on
            ${{ env.STAMP_IMAGE_REF }}: the CA bundle matches
            /etc/ssl/certs/.ca-certificates.crt.sha256 and the Java truststore
            matches /etc/ssl/certs/java/.cacerts.sha256.

            Image: ${{ env.IMAGE_REF }}
            Digest: ${{ steps.image.outputs.digest }}
            Stamp image: ${{ env.STAMP_IMAGE_REF }}
            CA SHA: ${{ steps.ca.outputs.sha }}

            Signed-off-by: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
          branch: update-ca-cert-${{ steps.ca.outputs.sha }}
          delete-branch: true
          title: "chore(oscap): re-pin fixture base-image digests"
          body: |
            ## Fixture Base-Image Update

            Re-pins two values that must stay in lockstep:

            1. The `FROM cgr.dev/chainguard/wolfi-base:latest@sha256:...` line in
               every `tests/e2e/fixtures/*/Dockerfile`.
            2. The `pinned` wolfi-base digest constant asserted by
               `TestParseWolfiBaseRef` in `${{ env.TEST_PIN_FILE }}`.

            If these drift (e.g. Dependabot bumps the fixture digest without the
            test pin following), the offline harness unit tests break. This
            workflow is the authoritative update point for both together;
            `TestParseWolfiBaseRef` was run against the updated tree before this
            PR was opened.

            CertificateAudit itself no longer pins any hash — the OVAL reads each
            expected digest from the stamp file shipped beside the file it
            describes inside the scanned image
            (`/etc/ssl/certs/.ca-certificates.crt.sha256`, and on Java images
            `/etc/ssl/certs/java/.cacerts.sha256`). The `Verify trust-store stamp
            files` step above asserts both are present and agree, using
            `${{ env.STAMP_IMAGE_REF }}` because it carries both, so an image
            that dropped one would fail this run rather than silently red the
            E2E CertificateAudit assertions.

            - **Image**: `${{ env.IMAGE_REF }}`
            - **Digest**: `${{ steps.image.outputs.digest }}`
            - **Stamp image**: `${{ env.STAMP_IMAGE_REF }}`
            - **Stamp image digest**: `${{ steps.image.outputs.stamp_digest }}`
            - **CA SHA256**: `${{ steps.ca.outputs.sha }}`
            - **Fixtures changed**: `${{ steps.fixtures.outputs.fixtures_changed }}`
            - **Test pin changed**: `${{ steps.testpin.outputs.test_pin_changed }}`
          labels: |
            automated pr
      #- name: Enable auto-merge
      #  if: steps.cpr.outputs.pull-request-number != ''
      #  run: |
      #    gh pr merge --auto --squash \
      #      "https://github.com/${{ github.repository }}/pull/${{ steps.cpr.outputs.pull-request-number }}"
      #  env:
      #    GITHUB_TOKEN: ${{ steps.octo-sts.outputs.token }}
